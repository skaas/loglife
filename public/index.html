<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Telegram Obsidian Vault Bot</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7f9;
        color: #111827;
      }

      main {
        max-width: 720px;
        margin: 64px auto;
        padding: 24px;
      }

      .card {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 12px 32px rgba(17, 24, 39, 0.06);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 32px;
      }

      p {
        margin: 0 0 12px;
        line-height: 1.6;
      }

      code {
        background: #f3f4f6;
        padding: 2px 6px;
        border-radius: 6px;
      }

      ul {
        padding-left: 20px;
      }

      a {
        color: #2563eb;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>Telegram Obsidian Vault Bot</h1>
        <p>This deployment is running.</p>
        <ul>
          <li>Health check: <a href="/api/health"><code>/api/health</code></a></li>
          <li>Webhook endpoint: <code>/api/telegram/webhook</code></li>
          <li>Status API: <a href="/api"><code>/api</code></a></li>
        </ul>
      </div>
    </main>
  </body>
</html>
